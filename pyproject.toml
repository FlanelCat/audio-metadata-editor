[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-metadata-editor"
version = "0.1.0"
description = "A desktop metadata editor for MP3 and M4B files"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48",
    "PySide6>=6.11.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
audio-metadata-editor = "audio_metadata_editor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_metadata_editor = ["resources/application-icon.png"]
